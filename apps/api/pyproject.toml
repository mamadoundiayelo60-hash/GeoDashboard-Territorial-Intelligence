[project]
name = "geodashboard-api"
version = "0.1.0"
description = "API sécurisée de GeoDashboard Territorial Intelligence Studio"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1",
  "geopandas>=1.1,<2",
  "httpx>=0.28,<1",
  "pyproj>=3.7,<4",
  "pyogrio>=0.11,<1",
  "pydantic-settings>=2.10,<3",
  "psycopg[binary]>=3.2,<4",
  "sqlalchemy>=2.0,<3",
  "shapely>=2.1,<3",
  "sqlglot>=27,<29",
  "python-multipart>=0.0.20,<1",
  "uvicorn[standard]>=0.35,<1",
  "reportlab>=4.4,<5",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pypdf>=6,<7",
  "pytest>=8.4,<9",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
  "types-shapely>=2.1,<3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/geodashboard_api"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=geodashboard_api --cov-report=term-missing"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["geodashboard_api"]

[[tool.mypy.overrides]]
module = ["geopandas", "geopandas.*", "pandas", "pandas.*", "reportlab", "reportlab.*", "sqlalchemy", "sqlalchemy.*"]
ignore_missing_imports = true
disable_error_code = ["import-untyped"]

[[tool.mypy.overrides]]
module = ["geodashboard_api.services.reporting"]
disable_error_code = ["misc", "no-any-return"]
